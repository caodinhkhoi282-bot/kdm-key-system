<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDM TEAM - Key System</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .navbar { width: 100%; background: #ffffff; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; }
        .navbar .brand { font-weight: 800; font-size: 22px; color: #1a202c; letter-spacing: 0.5px; }
        .navbar .nav-icons { display: flex; gap: 20px; color: #4a5568; font-size: 18px; cursor: pointer; }

        .container { width: 100%; max-width: 420px; margin-top: 30px; padding: 0 15px; }
        .card { background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
        .card-header { padding: 15px 20px; display: flex; justify-content: flex-end; align-items: center; color: #718096; font-size: 14px; font-weight: 600; }
        .card-header span { margin-left: 6px; }

        .card-body { padding: 10px 20px 25px 20px; display: flex; flex-direction: column; gap: 16px; }
        .input-group { display: flex; align-items: center; border: 1px solid #cbd5e0; border-radius: 8px; padding: 10px 14px; background: #ffffff; }
        .input-group i { color: #718096; margin-right: 12px; font-size: 16px; width: 20px; text-align: center; }
        .input-group select, .input-group input { border: none; outline: none; width: 100%; font-size: 15px; color: #2d3748; background: transparent; }

        .btn-generate { background-color: #0066ff; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; align-self: flex-end; width: auto; min-width: 130px; margin-top: 10px; transition: background 0.2s; }
        .btn-generate:hover { background-color: #0052cc; }

        /* NHÁNH PHỤ (Hiện sau khi vượt Link4M thành công) */
        .sub-branch { display: none; margin-top: 15px; padding: 15px; background: #f8fafc; border: 1px dashed #0066ff; border-radius: 8px; }
        .sub-branch h4 { color: #2b6cb0; font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .info-text { font-size: 12px; color: #718096; margin-bottom: 5px; word-break: break-all; }
        .key-display { display: flex; gap: 8px; margin-top: 10px; }
        .key-box { flex: 1; background: #edf2f7; border: 1px solid #cbd5e0; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-family: monospace; color: #2d3748; font-size: 15px; text-align: center; }
        .btn-copy { background: #38a169; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-copy:hover { background: #2f855a; }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <div class="navbar">
        <div class="brand">KDM TEAM</div>
        <div class="nav-icons"><i class="fa-regular fa-sun"></i><i class="fa-solid fa-bars"></i></div>
    </div>

    <!-- Main Card -->
    <div class="container">
        <div class="card">
            <div class="card-header">
                <i class="fa-regular fa-user"></i>
                <span>KDM</span>
            </div>

            <div class="card-body">
                <!-- Chọn App (Roblox) -->
                <div class="input-group">
                    <i class="fa-solid fa-gamepad"></i>
                    <select id="appName">
                        <option value="Roblox" selected>Roblox</option>
                    </select>
                </div>

                <!-- Thiết bị -->
                <div class="input-group">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <input type="text" id="deviceLimit" value="1 Thiết bị" readonly>
                </div>

                <!-- Hạn dùng -->
                <div class="input-group">
                    <i class="fa-regular fa-calendar-days"></i>
                    <input type="text" id="durationDays" value="24 Giờ" readonly>
                </div>

                <!-- Loại Key (FREE) -->
                <div class="input-group">
                    <i class="fa-regular fa-gem"></i>
                    <select id="keyType">
                        <option value="FREE" selected>FREE</option>
                    </select>
                </div>

                <!-- Nút Get Key -->
                <button class="btn-generate" id="actionBtn" type="button">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Generate
                </button>

                <!-- NHÁNH PHỤ (Hiện sau khi vượt Link4M) -->
                <div id="subBranch" class="sub-branch">
                    <h4><i class="fa-solid fa-shield-halved"></i> XÁC MINH THÀNH CÔNG</h4>
                    <div class="info-text"><strong>IP:</strong> <span id="userIp">Đang tải...</span></div>
                    <div class="info-text"><strong>Device Token:</strong> <span id="userToken">Đang tạo...</span></div>
                    <div class="info-text"><strong>Thời hạn:</strong> 24 Giờ</div>
                    
                    <div class="key-display">
                        <div class="key-box" id="finalKey">Đang tạo Key...</div>
                        <button class="btn-copy" id="btnCopy" type="button"><i class="fa-regular fa-copy"></i> Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CẤU HÌNH THÔNG TIN DỰ ÁN
        const SUPABASE_URL = "https://tdzpkxtvclmwltqhlrnu.supabase.co";
        const SUPABASE_KEY = "sb_publishable_cI-bGd4IeYtdnzA76du1JA_JYVwA61M";
        const LINK4M_URL = "https://link4m.net/7V2pQumH";

        // Khởi tạo Supabase an toàn
        let supabaseClient = null;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // Tạo Device Token
        function getDeviceToken() {
            let token = localStorage.getItem("KDM_DEVICE_TOKEN");
            if (!token) {
                token = "DEV-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-" + Date.now().toString(36).toUpperCase();
                localStorage.setItem("KDM_DEVICE_TOKEN", token);
            }
            return token;
        }

        // Lấy IP người dùng
        async function getUserIP() {
            try {
                const res = await fetch("https://api.ipify.org?format=json");
                const data = await res.json();
                return data.ip;
            } catch {
                return "127.0.0.1";
            }
        }

        // SỰ KIỆN BẤM NÚT GENERATE (CHUYỂN CẢNH TRỰC TIẾP SANG LINK4M)
        document.getElementById("actionBtn").addEventListener("click", function() {
            const verifyToken = "KDM_" + Math.random().toString(36).substring(2, 8).toUpperCase();
            sessionStorage.setItem("KDM_VERIFY_TOKEN", verifyToken);

            // Chuyển hướng thẳng sang Link4M
            window.location.href = LINK4M_URL;
        });

        // KHI TRANG LẠI TRANG (KIỂM TRA NẾU ĐÃ QUAY VỀ TỪ LINK4M)
        window.addEventListener("DOMContentLoaded", async function() {
            const savedToken = sessionStorage.getItem("KDM_VERIFY_TOKEN");
            
            // Nếu phát hiện có token từ việc chuyển hướng
            if (savedToken) {
                // Ẩn nút cũ, mở Nhánh phụ
                document.getElementById("actionBtn").style.display = "none";
                document.getElementById("subBranch").style.display = "block";
                
                const ip = await getUserIP();
                const deviceToken = getDeviceToken();

                document.getElementById("userIp").innerText = ip;
                document.getElementById("userToken").innerText = deviceToken;

                generateKeyToSupabase(ip, deviceToken);
                
                // Xóa token để không bị tạo trùng khi reload
                sessionStorage.removeItem("KDM_VERIFY_TOKEN");
            }
        });

        // LƯU KEY VÀO SUPABASE
        async function generateKeyToSupabase(ip, deviceToken) {
            const randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            const generatedKey = `KDM-${randomCode}`;

            const now = new Date();
            const expiresAt = new Date(now.getTime() + 24 * 60 * 60 * 1000).toISOString();

            if (!supabaseClient && window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }

            if (supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('keys')
                    .insert([
                        { 
                            key_code: generatedKey, 
                            app_name: "Roblox", 
                            ip_address: ip,
                            device_token: deviceToken,
                            expires_at: expiresAt
                        }
                    ]);

                if (error) {
                    console.error("Lỗi Supabase:", error);
                    document.getElementById("finalKey").innerText = generatedKey; // Vẫn hiện key nếu lỗi kết nối
                } else {
                    document.getElementById("finalKey").innerText = generatedKey;
                }
            } else {
                document.getElementById("finalKey").innerText = generatedKey;
            }
        }

        // NÚT SAO CHÉP
        document.getElementById("btnCopy").addEventListener("click", function() {
            const keyText = document.getElementById("finalKey").innerText;
            navigator.clipboard.writeText(keyText);
            alert("Đã sao chép Key: " + keyText);
        });
    </script>
</body>
</html>
